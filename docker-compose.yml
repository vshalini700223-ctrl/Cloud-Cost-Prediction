services:
  model-inference-server:
    build: .
    command: gunicorn --bind 0.0.0.0:5001 model_server:app
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  cloud-cost-planner:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 app:app
    ports:
      - "5000:5000"
    environment:
      - MODEL_SERVER_URL=http://model-inference-server:5001
    depends_on:
      - model-inference-server
